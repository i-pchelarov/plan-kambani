<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 900" width="100%" height="100%"
     style="background-color: #ffffff; font-family: 'Courier New', Courier, monospace;">
    <g transform="translate(100, 100)">
        <!-- Външен общ габарит на сградата (Подравнен: x=50, width=600, height=400) -->
        <rect x="50" y="50" width="600" height="400" fill="#f5f5f5" stroke="#000" stroke-width="3"/>
        <text x="350" y="260" font-size="14" fill="#5d4037" font-weight="bold" text-anchor="middle">СГРАДА</text>

        <!-- ВЪНШЕН ТЕХНИЧЕСКИ ШКАФ (На западната стена, отвън: x=20, y=150) -->
        <rect x="20" y="150" width="30" height="60" fill="#b0bec5" stroke="#37474f" stroke-width="1.5"/>
        <text x="35" y="140" font-size="10" font-weight="bold" text-anchor="middle">ШКАФ</text>

        <!-- ЮЖНА ВЕРАНДА (Пред южната стена долу: x=50, y=450, същата ширина 600) -->
        <rect x="50" y="450" width="600" height="300" fill="#efebe9" stroke="#5d4037" stroke-width="2"
              stroke-dasharray="4,4"/>
        <text x="350" y="610" font-size="14" fill="#5d4037" font-weight="bold" text-anchor="middle">ЮЖНА ВЕРАНДА</text>

        <!-- ВЪТРЕШНИ СТЕНИ НА БАНЯТА (Североизток: ширина 200px, дълбочина 1500px) -->
        <line x1="450" y1="50" x2="450" y2="200" stroke="#000" stroke-width="2"/>
        <line x1="450" y1="200" x2="650" y2="200" stroke="#000" stroke-width="2"/>
        <text x="550" y="135" font-size="12" fill="#1565c0" font-weight="bold" text-anchor="middle">БАНЯ</text>

        <!-- ВРАТА НА БАНЯТА (Ширина 60px, центрирана на южната й стена: x=545..605) -->
        <rect x="448" y="100" width="4" height="60" fill="#fff" stroke="#000" stroke-width="1"/>
        <text x="420" y="130" font-size="9" fill="#000" text-anchor="middle">ВР. 60</text>

        <!-- ДВЕ ЮЖНИ ВРАТИ -->
        <rect x="135" y="448" width="165" height="4" fill="#fff" stroke="#c62828" stroke-width="1"/>
        <rect x="400" y="448" width="165" height="4" fill="#fff" stroke="#c62828" stroke-width="1"/>
        <text x="217" y="432" font-size="9" fill="#c62828" text-anchor="middle">ВХ. ВРАТА 165</text>
        <text x="482" y="432" font-size="9" fill="#c62828" text-anchor="middle">ВХ. ВРАТА 165</text>

        <!-- === МРЕЖА 2: АВТОНОМНА СОЛАРНА ИНСТАЛАЦИЯ (DC) === -->
        <!-- СИМВОЛ ЗА СОЛАРНИ ПАНЕЛИ И ОБНОВЕН PV СПУСК -->
        <g transform="translate(-40, 50)">
            <rect x="0" y="0" width="40" height="50" fill="#0d47a1" stroke="#fff" stroke-width="1" />
            <line x1="0" y1="15" x2="40" y2="15" stroke="#fff" stroke-width="0.7" />
            <line x1="0" y1="32" x2="40" y2="32" stroke="#fff" stroke-width="0.7" />
            <line x1="13" y1="0" x2="13" y2="50" stroke="#fff" stroke-width="0.7" />
            <line x1="26" y1="0" x2="26" y2="50" stroke="#fff" stroke-width="0.7" />
            <text x="20" y="-10" font-size="9" fill="#0d47a1" font-weight="bold" text-anchor="middle">PV ФОТОВОЛТАИК</text>
        </g>
        <path d="M 0,75 L 35,75 L 35,172" fill="none" stroke="#d32f2f" stroke-width="2.5" />
        <text x="15" y="92" font-size="8" fill="#d32f2f" font-weight="bold">PV СКУСК</text>

        <!-- АПАРАТУРА В ТЕХНИЧЕСКИЯ ШКАФ -->
        <rect x="23" y="153" width="24" height="16" fill="#e65100" stroke="#bf360c" stroke-width="1" />
        <text x="35" y="164" font-size="7" fill="#fff" font-weight="bold" text-anchor="middle">INV</text>
        <rect x="23" y="172" width="24" height="12" fill="#d32f2f" stroke="#9a0007" stroke-width="1" />
        <text x="35" y="181" font-size="6" fill="#fff" font-weight="bold" text-anchor="middle">РТ-DC</text>
        <rect x="23" y="187" width="24" height="20" fill="#37474f" stroke="#212121" stroke-width="1" />
        <text x="35" y="196" font-size="7" fill="#fff" font-weight="bold" text-anchor="middle">BAT</text>

        <!-- КАБЕЛНИ МАГИСТРАЛИ (Прилепени плътно по вътрешния ръб на стените) -->
        <!-- Горно трасе - вкарано точно под северния зид (y=52) -->
        <path d="M 38,165 L 54,165 L 54,54 L 430,54" fill="none" stroke="#d32f2f" stroke-width="1.5" stroke-dasharray="4,2" />
        <!-- Долно трасе - вкарано точно по вътрешния ръб на западния (x=52) и южния зид (y=448) -->
        <path d="M 54,165 L 54,445 L 630,445 L 630,435" fill="none" stroke="#d32f2f" stroke-width="1.5" stroke-dasharray="4,2" />

        <!-- ВЕРТИКАЛЕН СОЛАРЕН ВЪЗХОДЯЩ ЩРАНГ КЪМ НИВО 2 (Захранващ извод) -->
        <circle cx="65" cy="150" r="6" fill="#d32f2f" />
        <circle cx="65" cy="150" r="1.5" fill="#fff" />
        <text x="78" y="154" font-size="8" fill="#d32f2f" font-weight="bold">DC ЩРАНГ КЪМ НИВО 2</text>

        <!-- ДНЕВНА ЗОНА (Ниво 1) -->
        <!-- Захранваща линия от горната стена (y=52) до центъра на LED лампата -->
        <path d="M 200,52 L 200,242" fill="none" stroke="#d32f2f" stroke-width="1.5" stroke-dasharray="4,2" />
        <circle cx="200" cy="250" r="8" fill="none" stroke="#d32f2f" stroke-width="1.5" />
        <line x1="194.5" y1="244.5" x2="205.5" y2="255.5" stroke="#d32f2f" stroke-width="1.5" />
        <line x1="205.5" y1="244.5" x2="194.5" y2="255.5" stroke="#d32f2f" stroke-width="1.5" />
        <text x="200" y="272" font-size="9" fill="#d32f2f" font-weight="bold" text-anchor="middle">LED ДНЕВНА</text>

        <!-- БАНЯ (Ниво 1) -->
        <!-- Захранваща линия, влизаща от северната стена (y=52) директно до лампата в банята -->
        <path d="M 430,54 L 550,54 L 550,117" fill="none" stroke="#d32f2f" stroke-width="1.5" stroke-dasharray="4,2" />
        <circle cx="550" cy="125" r="8" fill="none" stroke="#d32f2f" stroke-width="1.5" />
        <line x1="544.5" y1="119.5" x2="555.5" y2="130.5" stroke="#d32f2f" stroke-width="1.5" />
        <line x1="555.5" y1="119.5" x2="544.5" y2="130.5" stroke="#d32f2f" stroke-width="1.5" />
        <text x="550" y="145" font-size="9" fill="#d32f2f" font-weight="bold" text-anchor="middle">LED БАНЯ</text>

        <!-- USB Дневна - захранена от долната линия при y=440 -->
        <rect x="95" y="422" width="12" height="12" fill="#ffcdd2" stroke="#d32f2f" stroke-width="1" />
        <text x="95" y="414" font-size="8" fill="#d32f2f" font-weight="bold">USB ДНЕВНА</text>

        <!-- АНТРЕ (Ниво 1) -->
        <!-- USB Антре - повдигнато леко над линията, за да не застъпва стената -->
        <rect x="624" y="422" width="12" height="12" fill="#ffcdd2" stroke="#d32f2f" stroke-width="1" />
        <text x="615" y="418" font-size="8" fill="#d32f2f" font-weight="bold" text-anchor="end">USB АНТРЕ</text>

        <!-- ЮЖНА ВЕРАНДА (Изместени компоненти между двете врати) -->
        <!-- Кабелно разклонение през простена (при x=350) директно към лампата отвън -->
        <path d="M 350,445 L 350,470" fill="none" stroke="#d32f2f" stroke-width="1.5" stroke-dasharray="4,2" />
        <circle cx="350" cy="478" r="8" fill="none" stroke="#d32f2f" stroke-width="1.5" />
        <line x1="344.5" y1="472.5" x2="355.5" y2="483.5" stroke="#d32f2f" stroke-width="1.5" />
        <line x1="355.5" y1="472.5" x2="344.5" y2="483.5" stroke="#d32f2f" stroke-width="1.5" />
        <text x="350" y="498" font-size="9" fill="#d32f2f" font-weight="bold" text-anchor="middle">LED ВЕРАНДА (IP65)</text>

        <!-- Външен влагозащитен USB порт на верандата (вляво от вратата при x=100) -->
        <path d="M 100,435 L 100,455" fill="none" stroke="#d32f2f" stroke-width="1.5" stroke-dasharray="4,2" />
        <rect x="94" y="455" width="12" height="12" fill="#ffcdd2" stroke="#d32f2f" stroke-width="1" />
        <text x="112" y="465" font-size="8" fill="#d32f2f" font-weight="bold" text-anchor="start">USB ВЕРАНДА</text>

    </g>
</svg>