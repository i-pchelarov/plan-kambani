<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 700" width="100%" height="100%" style="background-color: #ffffff; font-family: 'Courier New', Courier, monospace;">
    <g transform="translate(100, 100)">
        <!-- Външен габарит на сградата (Ниво 2) -->
        <rect x="50" y="50" width="600" height="400" fill="#fafafa" stroke="#000" stroke-width="3" />

        <text x="350" y="240" font-size="14" fill="#5d4037" font-weight="bold" text-anchor="middle">ЕМПОРЕ (НИВО 2)</text>

        <!-- Контур на платформата (Платформа над банята: x=450..650, y=50..200) -->
        <rect x="450" y="50" width="200" height="150" fill="#f5f5f5" stroke="#5d4037" stroke-width="2" stroke-dasharray="4,4" />
        <text x="550" y="175" font-size="11" fill="#1565c0" font-weight="bold" text-anchor="middle">ТАВАН БАНЯ</text>

        <!-- === МРЕЖА 2: DC ИНСТАЛАЦИЯ - ЕМПОРЕ === -->
        <!-- Вертикален соларен възходящ щранг (Кабелът идва от първо ниво при x=65, y=150) -->
        <circle cx="65" cy="150" r="6" fill="#d32f2f" />
        <circle cx="65" cy="150" r="2" fill="#fff" />
        <text x="78" y="154" font-size="8" fill="#d32f2f" font-weight="bold">DC ЩРАНГ ОТ НИВО 1</text>

        <!-- КАБЕЛНИ МАГИСТРАЛИ (Плътно по стената на второ ниво y=65) -->
        <path d="M 65,150 L 65,55 L 552,55" fill="none" stroke="#d32f2f" stroke-width="1.5" stroke-dasharray="4,2" />

        <!-- ЛЯВА ЧАСТ - КОНСУМАТОРИ (Дневна зона над емпорето) -->
        <!-- Нова захранваща линия към лявата лампа -->
        <path d="M 200,55 L 200,105" fill="none" stroke="#d32f2f" stroke-width="1.5" stroke-dasharray="4,2" />
        <circle cx="200" cy="115" r="8" fill="none" stroke="#d32f2f" stroke-width="1.5" />
        <line x1="194.5" y1="109.5" x2="205.5" y2="120.5" stroke="#d32f2f" stroke-width="1.5" />
        <line x1="205.5" y1="109.5" x2="194.5" y2="120.5" stroke="#d32f2f" stroke-width="1.5" />
        <text x="200" y="137" font-size="9" fill="#d32f2f" font-weight="bold" text-anchor="middle">LED ЛЯВО</text>

        <!-- Изместен USB контакт в лявата част на западната стена (y=110) -->
        <rect x="59" y="104" width="12" height="12" fill="#ffcdd2" stroke="#d32f2f" stroke-width="1" />
        <text x="76" y="113" font-size="8" fill="#d32f2f" font-weight="bold" text-anchor="start">USB ЛЯВО</text>

        <!-- ДЯСНА ЧАСТ - КОНСУМАТОРИ (Спална зона над банята) -->
        <!-- Захранваща линия към дясната лампа -->
        <path d="M 550,55 L 550,105" fill="none" stroke="#d32f2f" stroke-width="1.5" stroke-dasharray="4,2" />
        <circle cx="550" cy="115" r="8" fill="none" stroke="#d32f2f" stroke-width="1.5" />
        <line x1="544.5" y1="109.5" x2="555.5" y2="120.5" stroke="#d32f2f" stroke-width="1.5" />
        <line x1="555.5" y1="109.5" x2="544.5" y2="120.5" stroke="#d32f2f" stroke-width="1.5" />
        <text x="550" y="137" font-size="9" fill="#d32f2f" font-weight="bold" text-anchor="middle">LED ДЯСНО</text>

    </g>
</svg>
