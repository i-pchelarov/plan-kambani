<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="100%" height="100%" style="background-color: #ffffff; font-family: 'Courier New', Courier, monospace;">
    <!-- Мащаб SVG: 1 px = 1 cm; 100 px = 1 m. Юг е надолу. -->
    <!-- Обозначение на посоките -->
    <g transform="translate(780, 40)" font-size="12" font-weight="bold" fill="#555" text-anchor="middle">
        <text x="0" y="-15">СЕВЕР (▲)</text>
        <text x="0" y="780">ЮГ (▼)</text>
        <text x="-740" y="380" text-anchor="start">◄ ЗАПАД</text>
        <text x="740" y="380" text-anchor="end">ИЗТОК ►</text>
    </g>

    <!-- ================= НИВО 1 (ПАРТЕР) ================= -->
    <!-- Локално: сграда x=50..650 (6.00 м), y=50..450 (4.00 м). Север = по-малко y. -->
    <g transform="translate(50, 120)">
        <g font-size="11" fill="#444" stroke="#444" stroke-width="0.5">
            <line x1="50" y1="10" x2="650" y2="10" />
            <line x1="50" y1="5" x2="50" y2="15" />
            <line x1="650" y1="5" x2="650" y2="15" />
            <text x="350" y="2" stroke="none" text-anchor="middle" font-weight="bold" font-size="13">ОБЩА ДЪЛЖИНА: 6.00 м</text>
        </g>

        <text x="350" y="-20" font-size="16" font-weight="bold" text-anchor="middle" fill="#000">НИВО 1 - ПАРТЕР (Кота +0.12 Под)</text>
        <rect x="50" y="50" width="600" height="400" fill="#f5f5f5" stroke="#000" stroke-width="3" />

        <!-- Баня 200 x 150 см, североизточен ъгъл: x=450 (4.00 м от запад), y=50 -->
        <rect x="450" y="50" width="200" height="150" fill="#e3f2fd" stroke="#000" stroke-width="2" />
        <text x="550" y="125" font-size="13" font-weight="bold" text-anchor="middle" fill="#1565c0">БАНЯ 200 х 150</text>

        <!-- ПРОЗОРЕЦ НА БАНЯТА (ОТ ИЗТОК) - 50 см, отстъп 50 см от север -->
        <!-- y = 50 + 50 = 100, височина 50 px. Отвор по източната стена (графичен, 6 px). -->
        <rect x="644" y="100" width="6" height="50" fill="#ffffff" stroke="#1565c0" stroke-width="1.5" />
        <text x="658" y="128" font-size="9" fill="#1565c0" font-weight="bold">ПР. 50</text>

        <!-- ВРАТА НА БАНЯТА (ОТ ЗАПАД) - 60 см, отстъп 45 см от север, отваряне на запад (навън) -->
        <!-- y = 50 + 45 = 95, отвор 60 px до y=155 -->
        <rect x="444" y="95" width="6" height="60" fill="#ffffff" stroke="#1565c0" stroke-width="0" />
        <line x1="450" y1="155" x2="390" y2="155" stroke="#5d4037" stroke-width="2" />
        <path d="M 450,95 A 60,60 0 0,0 390,155" fill="none" stroke="#5d4037" stroke-dasharray="2,2" />
        <text x="440" y="88" font-size="9" fill="#5d4037" font-weight="bold" text-anchor="end">ВР. 60</text>

        <!-- Комин 25x25 см, до южната страна на банята, изравнен със западната ѝ стена -->
        <rect x="450" y="200" width="25" height="25" fill="#757575" stroke="#000" stroke-width="1.5" />
        <line x1="450" y1="200" x2="475" y2="225" stroke="#fff" />
        <line x1="475" y1="200" x2="450" y2="225" stroke="#fff" />
        <text x="442" y="218" font-size="10" fill="#333" font-weight="bold" text-anchor="end">КОМИН 25х25</text>

        <!-- Стълба 60 x 100 см пред банята, югоизток: x=590, y=200 (от север 150 см) -->
        <g fill="#ffebee" stroke="#c62828" stroke-width="2">
            <rect x="590" y="200" width="60" height="100" />
            <line x1="590" y1="233" x2="650" y2="233" />
            <line x1="590" y1="267" x2="650" y2="267" />
            <line x1="620" y1="290" x2="620" y2="210" stroke-dasharray="3,3" />
            <polygon points="620,205 616,213 624,213" fill="#c62828" />
        </g>
        <text x="620" y="318" font-size="11" fill="#c62828" font-weight="bold" text-anchor="middle">СТЪЛБА 60 х 100</text>

        <text x="250" y="250" font-size="14" font-weight="bold" fill="#333" text-anchor="middle">ДНЕВНА ЗОНА</text>

        <!-- Две двукрили южни врати 165 см; от запад: 85 / 165 / 100 / 165 / 85. Крило 82.5 см. -->
        <!-- Южна стена y=450. Лява врата x=135..300, център 217.5 -->
        <line x1="135" y1="450" x2="135" y2="532.5" stroke="#c62828" stroke-width="2" />
        <line x1="300" y1="450" x2="300" y2="532.5" stroke="#c62828" stroke-width="2" />
        <path d="M 135,532.5 A 82.5,82.5 0 0,0 217.5,450" fill="none" stroke="#c62828" stroke-dasharray="3,3" />
        <path d="M 300,532.5 A 82.5,82.5 0 0,1 217.5,450" fill="none" stroke="#c62828" stroke-dasharray="3,3" />
        <!-- Дясна врата x=400..565, център 482.5 -->
        <line x1="400" y1="450" x2="400" y2="532.5" stroke="#c62828" stroke-width="2" />
        <line x1="565" y1="450" x2="565" y2="532.5" stroke="#c62828" stroke-width="2" />
        <path d="M 400,532.5 A 82.5,82.5 0 0,0 482.5,450" fill="none" stroke="#c62828" stroke-dasharray="3,3" />
        <path d="M 565,532.5 A 82.5,82.5 0 0,1 482.5,450" fill="none" stroke="#c62828" stroke-dasharray="3,3" />

        <!-- ЛИНЕЙНИ РАЗМЕРИ И ОТСТОЯНИЯ ОТ ЮГ -->
        <g font-size="11" fill="#444" stroke="#444" stroke-width="0.5">
            <!-- Спомагателни тънки линии -->
            <line x1="50" y1="450" x2="50" y2="560" stroke="#bbb" />
            <line x1="135" y1="450" x2="135" y2="560" stroke="#bbb" />
            <line x1="300" y1="450" x2="300" y2="560" stroke="#bbb" />
            <line x1="400" y1="450" x2="400" y2="560" stroke="#bbb" />
            <line x1="565" y1="450" x2="565" y2="560" stroke="#bbb" />
            <line x1="650" y1="450" x2="650" y2="560" stroke="#bbb" />
            <line x1="50" y1="548" x2="650" y2="548" />
            <!-- Текстови стойности в см -->
            <text x="92.5" y="543" stroke="none" text-anchor="middle" font-weight="bold">85</text>
            <text x="217.5" y="543" stroke="none" text-anchor="middle" fill="#c62828" font-weight="bold">165 (Врата)</text>
            <text x="350" y="543" stroke="none" text-anchor="middle" font-weight="bold">100</text>
            <text x="482.5" y="543" stroke="none" text-anchor="middle" fill="#c62828" font-weight="bold">165 (Врата)</text>
            <text x="607.5" y="543" stroke="none" text-anchor="middle" font-weight="bold">85</text>
        </g>

        <g font-size="11" fill="#444" stroke="#444" stroke-width="0.5">
            <line x1="15" y1="50" x2="15" y2="450" />
            <text x="10" y="250" stroke="none" text-anchor="middle" font-weight="bold" transform="rotate(-90 10 250)">ОБЩА ШИРИНА: 4.00 м</text>
        </g>
    </g>

    <!-- ================= НИВО 2 (ПОДПОКРИВНО) ================= -->
    <g transform="translate(820, 120)">
        <text x="350" y="-20" font-size="16" font-weight="bold" text-anchor="middle" fill="#000">НИВО 2 - ПОДПОКРИВНО (Кота +2.20 Под)</text>
        <rect x="50" y="50" width="600" height="400" fill="none" stroke="#bbb" stroke-width="1" stroke-dasharray="5,5" />
        <!-- Емпоре: северните 2.00 м (y=50..250) -->
        <rect x="50" y="50" width="600" height="200" fill="#efebe9" stroke="#5d4037" stroke-width="3" />
        <text x="300" y="140" font-size="13" font-weight="bold" fill="#5d4037" text-anchor="middle">ПОДПОКРИВНА ПЛАТФОРМА (ЕМПОРЕ)</text>
        <rect x="450" y="200" width="25" height="25" fill="#757575" stroke="#000" stroke-width="1.5" />
        <!-- Излаз на стълбата върху емпорето (60 x 50 см в северната половина на стълбата) -->
        <g fill="#ffebee" stroke="#c62828" stroke-width="2">
            <rect x="590" y="200" width="60" height="50" />
            <circle cx="620" cy="225" r="3" fill="#c62828" />
        </g>
        <rect x="50" y="250" width="600" height="200" fill="#fff" stroke="#ccc" stroke-width="1" />
        <text x="350" y="360" font-size="12" fill="#999" text-anchor="middle" font-style="italic">ОТВОРЕН СВЕТЪЛ ОБЕМ КЪМ НИВО 1</text>
    </g>

    <!-- ИНФОРМАЦИОННА ТАБЛИЦА -->
    <g transform="translate(1250, 750)" font-size="11" fill="#000">
        <rect x="0" y="0" width="300" height="100" fill="#fafafa" stroke="#000" stroke-width="1.5" />
        <line x1="0" y1="25" x2="300" y2="25" stroke="#000" />
        <line x1="0" y1="50" x2="300" y2="50" stroke="#000" />
        <line x1="0" y1="75" x2="300" y2="75" stroke="#000" />
        <line x1="100" y1="75" x2="100" y2="100" stroke="#000" />
        <text x="10" y="18" font-weight="bold">ОБЕКТ: Еднофамилна постройка (6х4м)</text>
        <text x="10" y="43" font-weight="bold">ЧЕРТЕЖ: Архитектурен план - Ниво 1 и Ниво 2</text>
        <text x="10" y="68">ФАЗА: Концептуален проект</text>
        <text x="10" y="91">МАЩАБ: М 1:50</text>
        <text x="110" y="91">ДАТА: 05.10.2026 г.</text>
    </g>
    <text x="1250" y="868" font-size="10" fill="#666">SVG: 1 px = 1 cm</text>
</svg>
