<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 650" width="100%" height="100%" style="background-color: #ffffff; font-family: 'Courier New', Courier, monospace;">
    <!-- Обозначение на посоките -->
    <g transform="translate(650, 40)" font-size="12" font-weight="bold" fill="#555" text-anchor="middle">
        <text x="0" y="-15">СЕВЕР (▲)</text>
        <text x="0" y="560">ЮГ (▼)</text>
        <text x="-600" y="280" text-anchor="start">◄ ЗАПАД</text>
        <text x="600" y="280" text-anchor="end">ИЗТОК ►</text>
    </g>

    <!-- ================= НИВО 1 (ПАРТЕР) ================= -->
    <g transform="translate(50, 100)">
        <!-- Заглавие -->
        <text x="300" y="-30" font-size="18" font-weight="bold" text-anchor="middle" fill="#000">НИВО 1 - ПАРТЕР (0.00)</text>

        <!-- Външен контур на сградата (6.00m x 4.00m -> 500px x 333px) -->
        <!-- Мащаб: 1 метър = 83.33 пиксела -->
        <rect x="50" y="50" width="500" height="333" fill="#f5f5f5" stroke="#000" stroke-width="3" />

        <!-- Баня вдясно (2.00m дължина, 1.50m ширина) -->
        <!-- Позиция: от x = 383 до 550, от y = 50 до 175 -->
        <rect x="383" y="50" width="167" height="125" fill="#e3f2fd" stroke="#000" stroke-width="2" />
        <text x="455" y="115" font-size="14" font-weight="bold" text-anchor="middle" fill="#1565c0">БАНЯ</text>

        <!-- Комин в долния ляв ъгъл на банята (25х25 см -> 21х21 px) -->
        <!-- Разположение: x = 383, y = 175 - 21 = 154 -->
        <rect x="383" y="154" width="21" height="21" fill="#757575" stroke="#000" stroke-width="1.5" />
        <line x1="383" y1="154" x2="404" y2="175" stroke="#fff" stroke-width="1" />
        <line x1="404" y1="154" x2="383" y2="175" stroke="#fff" stroke-width="1" />
        <text x="410" y="148" font-size="10" fill="#333" font-weight="bold">К.</text>

        <!-- Стълба - най-вдясно (60 см широка, 100 см дълга) -->
        <!-- Разположение до източната стена: x = 550 - 50 = 500. Дължина надолу по y от банята: 175 до 258 -->
        <g fill="#ffebee" stroke="#c62828" stroke-width="2">
            <rect x="500" y="175" width="50" height="83" />
            <!-- Стъпала -->
            <line x1="500" y1="196" x2="550" y2="196" />
            <line x1="500" y1="217" x2="550" y2="217" />
            <line x1="500" y1="238" x2="550" y2="238" />
            <!-- Посока на качване (нагоре към второ ниво) -->
            <line x1="525" y1="245" x2="525" y2="185" stroke-dasharray="3,3" />
            <polygon points="525,180 521,188 529,188" fill="#c62828" />
        </g>
        <text x="490" y="222" font-size="11" fill="#c62828" font-weight="bold" text-anchor="end">СТЪЛБА</text>

        <!-- Дневна зона -->
        <text x="210" y="210" font-size="14" font-weight="bold" fill="#333" text-anchor="middle">ДНЕВНА / ОБЩО ПОМЕЩЕНИЕ</text>

        <!-- Две двукрили южни врати (165 см обща ширина -> 137.5 px; всяко крило по 68.7 px) -->
        <!-- Лява врата: от 121px до 258.5px -->
        <line x1="121" y1="383" x2="121" y2="451.7" stroke="#c62828" stroke-width="2" /> <!-- Ляво крило -->
        <line x1="258.5" y1="383" x2="258.5" y2="451.7" stroke="#c62828" stroke-width="2" /> <!-- Дясно крило -->
        <path d="M 121,451.7 A 68.7,68.7 0 0,0 189.7,383" fill="none" stroke="#c62828" stroke-width="1.5" stroke-dasharray="3,3" />
        <path d="M 258.5,451.7 A 68.7,68.7 0 0,1 189.8,383" fill="none" stroke="#c62828" stroke-width="1.5" stroke-dasharray="3,3" />

        <!-- Дясна врата: от 341px до 478.5px -->
        <line x1="341" y1="383" x2="341" y2="451.7" stroke="#c62828" stroke-width="2" /> <!-- Ляво крило -->
        <line x1="478.5" y1="383" x2="478.5" y2="451.7" stroke="#c62828" stroke-width="2" /> <!-- Дясно крило -->
        <path d="M 341,451.7 A 68.7,68.7 0 0,0 409.7,383" fill="none" stroke="#c62828" stroke-width="1.5" stroke-dasharray="3,3" />
        <path d="M 478.5,451.7 A 68.7,68.7 0 0,1 409.8,383" fill="none" stroke="#c62828" stroke-width="1.5" stroke-dasharray="3,3" />
    </g>

    <!-- ================= НИВО 2 (ПОДПОКРИВНО) ================= -->
    <g transform="translate(700, 100)">
        <!-- Заглавие -->
        <text x="300" y="-30" font-size="18" font-weight="bold" text-anchor="middle" fill="#000">НИВО 2 - ПОДПОКРИВНО (+2.60)</text>

        <!-- Външен общ контур на сградата (за визуален ориентир, пунктиран) -->
        <rect x="50" y="50" width="500" height="333" fill="none" stroke="#bbb" stroke-width="1" stroke-dasharray="5,5" />

        <!-- Подпокривна платформа (6.00m дължина, 2.00m ширина в горната част) -->
        <rect x="50" y="50" width="500" height="167" fill="#efebe9" stroke="#5d4037" stroke-width="3" />
        <text x="250" y="130" font-size="14" font-weight="bold" fill="#5d4037" text-anchor="middle">ПОДПОКРИВНА ПЛАТФОРМА / ЕМПОРЕ</text>

        <!-- Контур на банята отдолу (пунктиран) и комина -->
        <line x1="383" y1="50" x2="383" y2="167" stroke="#bcaaa4" stroke-width="1.5" stroke-dasharray="4,4" />
        <rect x="383" y="146" width="21" height="21" fill="#757575" stroke="#000" stroke-width="1.5" />

        <!-- Отвор/Празно пространство над първо ниво -->
        <rect x="50" y="217" width="500" height="166" fill="#fff" stroke="#ccc" stroke-width="1" />
        <text x="300" y="310" font-size="13" fill="#999" text-anchor="middle" font-style="italic">СВЕТЪЛ ОТВОР КЪМ НИВО 1 (DOUBLE HEIGHT)</text>

        <!-- Горна точка на стълбата (излизаща в десния край на платформата) -->
        <g fill="#ffebee" stroke="#c62828" stroke-width="2">
            <rect x="500" y="175" width="50" height="42" />
            <line x1="500" y1="196" x2="550" y2="196" />
            <circle cx="525" cy="185" r="3" fill="#c62828" />
        </g>
    </g>
</svg>
