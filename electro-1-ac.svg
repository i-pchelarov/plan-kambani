<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 900" width="100%" height="100%"
     style="background-color: #ffffff; font-family: 'Courier New', Courier, monospace;">
    <g transform="translate(100, 100)">
        <!-- Външен общ габарит на сградата (Подравнен: x=50, width=600, height=400) -->
        <rect x="50" y="50" width="600" height="400" fill="#f5f5f5" stroke="#000" stroke-width="3"/>
        <text x="350" y="260" font-size="14" fill="#5d4037" font-weight="bold" text-anchor="middle">СГРАДА</text>

        <!-- ВЪНШЕН ТЕХНИЧЕСКИ ШКАФ (На западната стена, отвън: x=20, y=150) -->
        <rect x="20" y="150" width="30" height="60" fill="#b0bec5" stroke="#37474f" stroke-width="1.5"/>
        <text x="35" y="140" font-size="10" font-weight="bold" text-anchor="middle">ШКАФ</text>

        <!-- ВЪНШНО ВКЛЮЧВАНЕ ОТ ГРИД-А (Захранващ кабел 220V от Енергото) -->
        <line x1="-30" y1="180" x2="20" y2="180" stroke="#0d47a1" stroke-width="3" stroke-dasharray="5,3"/>
        <text x="-25" y="175" font-size="9" fill="#0d47a1" font-weight="bold">ГРИД 220V</text>

        <!-- ЮЖНА ВЕРАНДА (Пред южната стена долу: x=50, y=450, същата ширина 600) -->
        <rect x="50" y="450" width="600" height="300" fill="#efebe9" stroke="#5d4037" stroke-width="2"
              stroke-dasharray="4,4"/>
        <text x="350" y="610" font-size="14" fill="#5d4037" font-weight="bold" text-anchor="middle">ЮЖНА ВЕРАНДА</text>

        <!-- ВЪТРЕШНИ СТЕНИ НА БАНЯТА (Североизток: ширина 200px, дълбочина 1500px) -->
        <line x1="450" y1="50" x2="450" y2="200" stroke="#000" stroke-width="2"/>
        <line x1="450" y1="200" x2="650" y2="200" stroke="#000" stroke-width="2"/>
        <text x="550" y="135" font-size="12" fill="#1565c0" font-weight="bold" text-anchor="middle">БАНЯ</text>

        <!-- ВРАТА НА БАНЯТА (Ширина 60px, центрирана на южната й стена: x=545..605) -->
        <rect x="448" y="100" width="4" height="60" fill="#fff" stroke="#000" stroke-width="1"/>
        <text x="420" y="130" font-size="9" fill="#000" text-anchor="middle">ВР. 60</text>

        <!-- ДВЕ ЮЖНИ ВРАТИ -->
        <rect x="135" y="448" width="165" height="4" fill="#fff" stroke="#c62828" stroke-width="1"/>
        <rect x="400" y="448" width="165" height="4" fill="#fff" stroke="#c62828" stroke-width="1"/>
        <text x="217" y="442" font-size="9" fill="#c62828" text-anchor="middle">ВХ. ВРАТА 165</text>
        <text x="482" y="442" font-size="9" fill="#c62828" text-anchor="middle">ВХ. ВРАТА 165</text>

        <!-- === МРЕЖА 1: ЦЕНТРАЛНО ЗАХРАНВАНЕ (220V AC) === -->
        <!-- Главно табло (ГРТ-AC) наместено прецизно ВЪТРЕ в техническия шкаф -->
        <rect x="22" y="160" width="16" height="40" fill="#0d47a1" stroke="#002171" stroke-width="1" />
        <text x="30" y="184" font-size="8" fill="#fff" font-weight="bold" text-anchor="middle">ГРТ</text>

        <!-- КАБЕЛНИ ТРАСЕТА (Син цвят) И СИЛОВИ КОНСУМАТОРИ ВЪТРЕ В СГРАДАТА -->
        <!-- Главно вътрешно AC трасе - върви по периметъра под горната стена (y=65) -->
        <path d="M 38,180 L 65,180 L 65,65 L 610,65 L 610,85" fill="none" stroke="#1976d2" stroke-width="2" stroke-dasharray="3,2" />

        <!-- Трасе надолу и по периметъра на долната зона (x=65, y=435, x=635) -->
        <path d="M 65,65 L 65,435 L 635,435 L 635,350" fill="none" stroke="#1976d2" stroke-width="2" stroke-dasharray="3,2" />

        <!-- КУХНЕНСКА ЗОНА (Горе вляво, Северозапад) -->
        <circle cx="110" cy="65" r="5" fill="#1976d2" />
        <text x="110" y="80" font-size="9" fill="#1976d2" font-weight="bold" text-anchor="middle">К. ХЛАДИЛНИК</text>

        <circle cx="200" cy="65" r="5" fill="#1976d2" />
        <text x="200" y="80" font-size="9" fill="#1976d2" font-weight="bold" text-anchor="middle">ДВОЕН К. ПЛОТ</text>

        <!-- БАНЯ (Горе вдясно, Североизток) -->
        <rect x="590" y="65" width="45" height="30" rx="5" fill="#bbdefb" stroke="#1976d2" stroke-width="1.5" />
        <text x="612" y="83" font-size="8" fill="#1976d2" font-weight="bold" text-anchor="middle">БОЙЛЕР</text>

        <path d="M 450,170 L 475,170" fill="none" stroke="#1976d2" stroke-width="2" stroke-dasharray="3,2" />
        <circle cx="475" cy="170" r="5" fill="#1976d2" />
        <text x="485" y="173" font-size="9" fill="#1976d2" font-weight="bold">К. ПЕРАЛНЯ</text>

        <!-- === ДОПЪЛНЕНИЕ: AC ОСВЕТЛЕНИЕ (220V) === -->
        <!-- 1. AC ЛЕД ЛАМПА ДНЕВНА (Захранена от горното трасе при x=200, y=65) -->
        <path d="M 200,65 L 200,142" fill="none" stroke="#1976d2" stroke-width="2" stroke-dasharray="3,2" />
        <circle cx="200" cy="150" r="8" fill="none" stroke="#1976d2" stroke-width="1.5" />
        <line x1="194.5" y1="144.5" x2="205.5" y2="155.5" stroke="#1976d2" stroke-width="1.5" />
        <line x1="205.5" y1="144.5" x2="194.5" y2="155.5" stroke="#1976d2" stroke-width="1.5" />
        <text x="200" y="172" font-size="9" fill="#1976d2" font-weight="bold" text-anchor="middle">AC ЛЕД ДНЕВНА</text>

        <!-- 2. AC ЛЕД ЛАМПА БАНЯ (Захранена от горното трасе при x=500, y=65) -->
        <path d="M 500,65 L 500,117" fill="none" stroke="#1976d2" stroke-width="2" stroke-dasharray="3,2" />
        <circle cx="500" cy="125" r="8" fill="none" stroke="#1976d2" stroke-width="1.5" />
        <line x1="494.5" y1="119.5" x2="505.5" y2="130.5" stroke="#1976d2" stroke-width="1.5" />
        <line x1="505.5" y1="119.5" x2="494.5" y2="130.5" stroke="#1976d2" stroke-width="1.5" />
        <text x="500" y="145" font-size="9" fill="#1976d2" font-weight="bold" text-anchor="middle">AC ЛЕД БАНЯ</text>

        <!-- ОБНОВЕНИ КОНТАКТИ ПО СТЕНИТЕ (Изместени по-нагоре) -->
        <!-- Контакт Дневна (На западната стена вляво при y=350) -->
        <circle cx="65" cy="350" r="5" fill="#1976d2" />
        <text x="80" y="353" font-size="9" fill="#1976d2" font-weight="bold" text-anchor="start">К. ДНЕВНА</text>

        <!-- Контакт Антре (На източната стена вдясно при y=350) -->
        <circle cx="635" cy="350" r="5" fill="#1976d2" />
        <text x="620" y="353" font-size="9" fill="#1976d2" font-weight="bold" text-anchor="end">К. АНТРЕ</text>

        <!-- ЮЖНА ВЕРАНДА (Външен влагозащитен контакт IP55 при x=90) -->
        <circle cx="90" cy="448" r="5" fill="#1976d2" />
        <text x="90" y="465" font-size="9" fill="#1976d2" font-weight="bold" text-anchor="middle">ВЪНШЕН К. IP55</text>

    </g>
</svg>