<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 900" width="100%" height="100%"
     style="background-color: #ffffff; font-family: 'Courier New', Courier, monospace;">
    <g transform="translate(100, 100)">
        <!-- Външен общ габарит на сградата (Подравнен: x=50, width=600, height=400) -->
        <rect x="50" y="50" width="600" height="400" fill="#f5f5f5" stroke="#000" stroke-width="3"/>
        <text x="350" y="260" font-size="14" fill="#5d4037" font-weight="bold" text-anchor="middle">СГРАДА</text>

        <!-- ЮЖНА ВЕРАНДА (Пред южната стена долу: x=50, y=450, същата ширина 600) -->
        <rect x="50" y="450" width="600" height="300" fill="#efebe9" stroke="#5d4037" stroke-width="2"
              stroke-dasharray="4,4"/>
        <text x="350" y="610" font-size="14" fill="#5d4037" font-weight="bold" text-anchor="middle">ЮЖНА ВЕРАНДА</text>

        <!-- ВЪТРЕШНИ СТЕНИ НА БАНЯТА (Североизток: ширина 200px, дълбочина 1500px) -->
        <line x1="450" y1="50" x2="450" y2="200" stroke="#000" stroke-width="2"/>
        <line x1="450" y1="200" x2="650" y2="200" stroke="#000" stroke-width="2"/>
        <text x="550" y="135" font-size="12" fill="#1565c0" font-weight="bold" text-anchor="middle">БАНЯ</text>

        <!-- ВРАТА НА БАНЯТА (Ширина 60px, центрирана на южната й стена: x=545..605) -->
        <rect x="448" y="100" width="4" height="60" fill="#fff" stroke="#000" stroke-width="1"/>
        <text x="420" y="130" font-size="9" fill="#000" text-anchor="middle">ВР. 60</text>

        <!-- ДВЕ ЮЖНИ ВРАТИ -->
        <rect x="135" y="448" width="165" height="4" fill="#fff" stroke="#c62828" stroke-width="1"/>
        <rect x="400" y="448" width="165" height="4" fill="#fff" stroke="#c62828" stroke-width="1"/>
        <text x="217" y="442" font-size="9" fill="#c62828" text-anchor="middle">ВХ. ВРАТА 165</text>
        <text x="482" y="442" font-size="9" fill="#c62828" text-anchor="middle">ВХ. ВРАТА 165</text>

        <!-- === ВиК ИНСТАЛАЦИИ (ОБНОВЕНА ЧЕРНОВА С КЛАДЕНЕЦ) === -->
        <!-- Санитарни уреди в БАНЯТА (Североизток) -->
        <!-- 1. Тоалетна (WC) - долу вляво в банята -->
        <rect x="460" y="160" width="30" height="25" fill="#fff" stroke="#795548" stroke-width="1.5" />
        <text x="475" y="152" font-size="8" fill="#795548" font-weight="bold" text-anchor="middle">WC</text>

        <!-- 2. Мивка Баня (Умивалник) - горе вляво в банята -->
        <rect x="460" y="65" width="25" height="30" rx="3" fill="#fff" stroke="#1565c0" stroke-width="1.5" />
        <text x="472" y="110" font-size="8" fill="#1565c0" font-weight="bold" text-anchor="middle">МИВКА</text>

        <!-- 3. Душ зона с подов сифон - вдясно -->
        <rect x="580" y="120" width="40" height="40" fill="none" stroke="#1565c0" stroke-width="1" stroke-dasharray="2,2" />
        <circle cx="600" cy="140" r="4" fill="#795548" />
        <text x="600" y="115" font-size="8" fill="#1565c0" font-weight="bold" text-anchor="middle">ДУШ</text>

        <!-- Канализационен Щранг за мръсна вода (КК Ø110 в ъгъла на банята) -->
        <circle cx="462" cy="185" r="6" fill="#795548" />
        <circle cx="462" cy="185" r="2" fill="#fff" />
        <text x="445" y="195" font-size="8" fill="#795548" font-weight="bold" text-anchor="end">КК Ø110</text>

        <!-- === ЮЖНА ВЕРАНДА: НОВ ВОДОИЗТОЧНИК И ЛЯТНА МИВКА === -->
        <!-- 1. ВГРАДЕН КЛАДЕНЕЦ (Долу вдясно на верандата: x=580, y=550) -->
        <circle cx="580" cy="550" r="25" fill="#e3f2fd" stroke="#1565c0" stroke-width="3" />
        <circle cx="580" cy="550" r="18" fill="none" stroke="#1565c0" stroke-width="1" stroke-dasharray="3,2" />
        <circle cx="580" cy="550" r="6" fill="#1565c0" />
        <text x="580" y="595" font-size="10" fill="#1565c0" font-weight="bold" text-anchor="middle">КЛАДЕНЕЦ</text>

        <!-- 2. ВЪНШНА МИВКА ДО КЛАДЕНЕЦА (Вляво от него на верандата: x=510..545) -->
        <rect x="510" y="530" width="35" height="35" rx="2" fill="#fff" stroke="#1565c0" stroke-width="1.5" />
        <circle cx="527" cy="547" r="3" fill="none" stroke="#1565c0" />
        <text x="527" y="518" font-size="8" fill="#1565c0" font-weight="bold" text-anchor="middle">Л. МИВКА</text>

        <!-- Локален водомерен / хидрофорен възел при захранване от кладенеца -->
        <rect x="510" y="575" width="20" height="15" fill="#bbdefb" stroke="#1565c0" stroke-width="1" />
        <text x="500" y="586" font-size="7" fill="#1565c0" font-weight="bold" text-anchor="end">ХИДРОФОР</text>

    </g>
</svg>